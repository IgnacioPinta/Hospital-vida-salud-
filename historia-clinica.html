
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia Clínica</title>
</head>
<body>

    <header>
        <h1 style="text-align: center;">
            Hospital Vida Salud
        </h1>

        <h2 style="text-align: center;">
            Formulario de Historia Clínica
        </h2>
    </header>

    <hr>

    <p>
        Complete los siguientes campos con su información personal
        y médica.
    </p>

    <form action="#">

        <h3>Datos personales</h3>

        <!-- CAMPO 1 -->
        <label for="nombre">1. Nombres:</label>
        <br><br>
        <input type="text" id="nombre" name="nombre"
        placeholder="Ingrese sus nombres">
        <br><br>

        <!-- CAMPO 2 -->
        <label for="apellido">2. Apellidos:</label>
        <br><br>
        <input type="text" id="apellido" name="apellido"
        placeholder="Ingrese sus apellidos">
        <br><br>

        <!-- CAMPO 3 -->
        <label for="cedula">3. Número de cédula:</label>
        <br><br>
        <input type="text" id="cedula" name="cedula"
        placeholder="Ingrese su cédula">
        <br><br>

        <!-- CAMPO 4 -->
        <label for="email">4. Correo electrónico:</label>
        <br><br>
        <input type="email" id="email" name="email"
        placeholder="Ingrese su correo">
        <br><br>

        <!-- CAMPO 5 -->
        <label for="fecha">5. Fecha de nacimiento:</label>
        <br><br>
        <input type="date" id="fecha" name="fecha">
        <br><br>

        <!-- CAMPO 6 -->
        <label for="telefono">6. Número de teléfono:</label>
        <br><br>
        <input type="tel" id="telefono" name="telefono"
        placeholder="Ingrese su teléfono">
        <br><br>

        <!-- CAMPO 7 -->
        <label for="cargas">7. Cargas familiares:</label>
        <br><br>
        <input type="number" id="cargas" name="cargas">
        <br><br>

        <!-- CAMPO 8 -->
        <label>8. Género:</label>
        <br><br>

        <label for="masculino">
            <input type="radio" id="masculino" name="genero">
            Masculino
        </label>

        <label for="femenino">
            <input type="radio" id="femenino" name="genero">
            Femenino
        </label>

        <label for="otro">
            <input type="radio" id="otro" name="genero">
            Otro
        </label>

        <br><br>

        <!-- CAMPO 9 -->
        <label for="ciudad">9. Ciudad:</label>
        <br><br>

        <select name="ciudad" id="ciudad">
            <option value="" disabled selected>Seleccionar</option>
            <option value="quito">Quito</option>
            <option value="latacunga">Latacunga</option>
            <option value="ibarra">Ibarra</option>
            <option value="cuenca">Cuenca</option>
            <option value="otro">Otro</option>
        </select>

        <br><br>

        <!-- CAMPO 10 -->
        <label for="motivo">10. Motivo de consulta:</label>
        <br><br>

        <textarea name="motivo" id="motivo"
        rows="4" cols="50"
        placeholder="Explique el motivo de su consulta"></textarea>

        <br><br>

        <!-- CAMPO 11 -->
        <label for="antecedentes">11. Antecedentes médicos:</label>
        <br><br>

        <textarea name="antecedentes" id="antecedentes"
        rows="4" cols="50"
        placeholder="Escriba sus antecedentes médicos"></textarea>

        <br><br>

        <!-- CAMPO 12 -->
        <label for="foto">12. Adjuntar fotografía:</label>
        <br><br>
        <input type="file" id="foto" name="foto">
        <br><br>

        <hr>

        <h3>Campos adicionales investigados</h3>

        <!-- CAMPO 13 -->
        <label for="alergias">13. Alergias:</label>
        <br><br>
        <input type="text" id="alergias" name="alergias"
        placeholder="Indique si tiene alergias">
        <br><br>

        <!-- CAMPO 14 -->
        <label for="sangre">14. Tipo de sangre:</label>
        <br><br>

        <select name="sangre" id="sangre">
            <option value="" disabled selected>Seleccionar</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="desconocido">Desconocido</option>
        </select>

        <br><br>

        <!-- CAMPO 15 -->
        <label for="emergencia">
            15. Teléfono de contacto de emergencia:
        </label>
        <br><br>

        <input type="tel" id="emergencia" name="emergencia"
        placeholder="Teléfono de un familiar">

        <br><br>

        <!-- BOTONES -->
        <input type="submit" value="Enviar">

        <button type="reset">Limpiar</button>

    </form>

    <hr>

    <footer>
        <p>&copy; 2026 Hospital Vida Salud</p>
        <address>Quito - Ecuador</address>
    </footer>

</body>
</html>
